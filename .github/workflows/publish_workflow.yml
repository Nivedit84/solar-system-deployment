name: Push to Main
on:
  push:
    branches:
      - main
  
jobs:
  docker_build_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.docker_user }}
          password: ${{ secrets.docker_pass }}
      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - name: Build docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ vars.docker_user }}/solar-system:${{ env.IMAGE_TAG }}
      - name: Aqua Security Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ vars.docker_user }}/solar-system:${{ env.IMAGE_TAG }}'
          format: 'table'
          output: trivy-results.sarif
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Aqua Trivy report
          path: trivy-results.sarif
      - name: Docker push
        run: docker push ${{ vars.docker_user }}/solar-system:${{ env.IMAGE_TAG }}
  
  gitops_update:
    runs-on: ubuntu-latest
    needs: docker_build_publish
    steps:
      - name: Checkout GitOps Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          repository: Nivedit84/solar-system-gitops
          token: ${{ secrets.ARGO_TOKEN }}
          path: gitops
      - name: Update image tag
        run: |
             cd gitops
             sed -i "s/tag:.*/tag:${{ env.IMAGE_TAG }}/" environments/dev/values.yaml
             cat environments/dev/values.yaml
      - name: Configure Git
        run: |
             cd gitops
             git config user.name "github-actions"
             git config user.email "github-actions@github.com"
      - name: Commit changes
        run: |
             cd gitops
             git add .
             if git diff --cached --quiet; then
               echo "No Changes"
             else
               git commit -m "Updated image"
               git push
             fi
