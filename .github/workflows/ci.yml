name: CI for NodeJS Application

on:
  pull_request:
    branches:
      - main
    type:
      - opened
    paths_ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: read
env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: superuser
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
jobs:
  unit_test:
    name: Unit Testing
    strategy:
      matrix:
        node-version: [18, 19, 20]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install Deps
        run: npm install

      - name: Run Unit Tests
        id: nodejs-unit-testing
        run: npm test
      
      - name: Upload Test Results
        if: always()  #Makes sure test report is uploaded even if the test fails
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results.xml
          path: test-results.xml

  code_coverage:
    
    strategy:
      matrix:
        os: [ubuntu-latest]
        node_version: [18, 20]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.0
      - name: Setup NodeJS Env
        uses: actions/setup-node@v7.0.0
        with:
          node_version: ${{ matrix.node_version }}
      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - name: Install Deps
        run: npm install
      - name: Run Code Coverage
        continue-on-error: true
        run: npm run coverage
      - name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: coverage
  
  docker-login:
    needs: [unit_test, code_coverage]
    strategy:
      matrix:
        os: [ubuntu-latest]
        node_version: [18, 20]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.docker_user }}
          password: ${{ secrets.docker_pass }}
      - name: Build and Test docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ vars.docker_user }}/solar-system:${{ github.sha }}
      - name: Docker image tag
        run: |
             docker images
             docker run -d --name solar-system-app \
                -p 3000:3000 \
                -e MONGO_URI=$MONGO_URI \
                -e MONGO_USERNAME=$MONGO_USERNAME \
                -e MONGO_PASSWORD=$MONGO_PASSWORD \
                ${{ vars.docker_user }}/solar-system:${{ github.sha }}
             echo testing image URL using wget
             wget -q -O - 127.0.0.1:3000/live | grep live
        
