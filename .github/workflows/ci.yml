name: CI for NodeJS Application

on:
  pull_request:
    branches:
      - main
    type:
      - opened
    paths_ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: read
env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: superuser
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
jobs:
  unit_test:
    name: Unit Testing
    strategy:
      matrix:
        node-version: [18, 19, 20]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Deps
        run: npm install

      - name: Run Unit Tests
        run: npm test
      
      - name: Upload Test Results
        if: always()   #Makes sure test report is uploaded even if the test fails
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results.xml
          path: test-results.xml

  code_coverage:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node_version: [18,19,20]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.0
      - name: Setup NodeJS Env
        uses: actions/setup-node@v7.0.0
        with:
          node_version: ${{ matrix.node_version }}
      - name: Install Deps
        run: npm install
      - name: Run Code Coverage
        run: npm run coverage
      - name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: coverage
