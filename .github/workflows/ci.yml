name: CI for NodeJS Application

on:
  pull_request:
    branches:
      - main
    type:
      - opened
    paths_ignore:
      - README.md

jobs:
  unit_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 18

      - name: Install Deps
        run: npm install

      - name: Run Unit Tests
        run: npm test