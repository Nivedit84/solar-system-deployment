name: CI for NodeJS Application

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: read
env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: superuser
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
jobs:
  secret_scanning:
    name: Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for secret leaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #build:
   # name: Build
    #runs-on: ubuntu-latest
    #steps:
     # - name: Checkout Repo
      #  uses: actions/checkout@v7
    #  - name: Setup NodeJS env
    #    uses: actions/setup-node@v7.0.0
    #    with:
    #      node-version: 20
    #      cache: npm
    #  - name: Run Build
    #    uses: npm run build
  unit_test_coverage:
    name: Unit Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install Deps
        run: npm ci

      - name: Run Unit Tests
        id: nodejs-unit-testing
        run: npm test
      
      - name: Upload Test Results
        if: always()  #Makes sure test report is uploaded even if the test fails
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Test results
          path: test-results.xml
      - name: Run Code Coverage
        continue-on-error: true
        run: npm run coverage
      - name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Coverage report
          path: coverage
  sast:
    needs: [secret_scanning, unit_test_coverage]
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    steps:
      - name: Official SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://44.212.31.24:9000/

  
  container_validation:
    needs: [sast]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.docker_user }}
          password: ${{ secrets.docker_pass }}
      - name: Build and Test docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ vars.docker_user }}/solar-system:${{ github.sha }}
      - name: Docker Test
        run: |
             docker images
             docker run -d --name solar-system-app \
                -p 3000:3000 \
                -e MONGO_URI=$MONGO_URI \
                -e MONGO_USERNAME=$MONGO_USERNAME \
                -e MONGO_PASSWORD=$MONGO_PASSWORD \
                ${{ vars.docker_user }}/solar-system:${{ github.sha }}

                sleep 30
             echo testing image URL using curl
             until curl --fail http://127.0.0.1:3000/live
              do
                echo "Waiting for application..."
                sleep 2
              done
      - name: Docker cleanup
        run: |
             docker rm -f solar-system-app
        
        
